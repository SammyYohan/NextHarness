[[harness]]
id = "deepseek-tui"
name = "DeepSeek TUI"
mode = "headless"
binaries = ["deepseek"]
companion_binaries = ["deepseek-tui"]
version_args = ["--version"]
run = ["{prompt}"]
requires_env = ["DEEPSEEK_API_KEY"]
default_tier = "paid"
enabled_by_default = false
verified = "unverified"
source = "https://github.com/Hmbown/DeepSeek-TUI"
install_hint = "npm install -g deepseek-tui"
notes = "Needs both binaries. The README shows `deepseek \"prompt\"` as a one-shot but it is not confirmed that this never opens the TUI: test with a harmless prompt and an idle timeout before enabling."

# ===========================================================================
# GUI APPLICATIONS — detected by name, never driven: Orion only prepares the
# handoff, copies the sentence to the clipboard and notifies the human.
# ===========================================================================
# Detection: macOS /Applications and ~/Applications (*.app); Windows Start Menu
# shortcuts, %LOCALAPPDATA%\Programs and the Uninstall registry keys (DisplayName);
# Linux .desktop files (/usr/share/applications, ~/.local/share/applications,
# flatpak and snap export dirs). Match case-insensitively on `gui_keywords`.

[[harness]]
id = "antigravity-app"
name = "Antigravity (desktop app)"
mode = "gui"
gui_keywords = ["antigravity"]
manual_prompt = "Read .orion/HANDOFF.md and continue the task."
default_tier = "free"
enabled_by_default = true
verified = "unverified"
source = "https://dev.to/jangwook_kim_e31e7291ad98/google-io-2026-antigravity-20-deep-dive-gemini-cli-is-gone-the-agent-ide-war-has-begun-4hn8"
notes = "Only the macOS app path /Applications/Antigravity.app was seen in a source. Other OS locations are found by keyword."

[[harness]]
id = "freebuff-desktop"
name = "Freebuff Desktop"
mode = "gui"
gui_keywords = ["freebuff"]
manual_prompt = "Read .orion/HANDOFF.md and continue the task."
default_tier = "free"
enabled_by_default = true
verified = "unverified"
source = "https://github.com/CodebuffAI/freebuff"
notes = "The repository advertises desktop downloads for macOS, Windows and Linux."

[[harness]]
id = "cursor-app"
name = "Cursor (editor)"
mode = "gui"
gui_keywords = ["cursor"]
manual_prompt = "Read .orion/HANDOFF.md and continue the task."
default_tier = "unknown"
enabled_by_default = true
verified = "unverified"
source = "https://pkg.go.dev/github.com/GrayCodeAI/hawk/internal/providers"
notes = "Third-party detectors look for the `cursor` command or the macOS app named Cursor."
